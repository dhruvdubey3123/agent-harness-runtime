name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Crash-recovery benchmark (resume must never duplicate a side effect)
        run: |
          python -m bench.crash_bench --trials 200 --seed 1
          python -c "import json,sys; r=json.load(open('bench/results.json'))['resume']; sys.exit(0 if r['runs_with_duplicated_side_effect'].startswith('0/') else 1)"
      - uses: actions/upload-artifact@v4
        with: {name: bench-results, path: bench/results.json}
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,triage]"
      - run: pytest -q tests/test_triage_bridge.py tests/test_envelope.py tests/test_outcome.py
      - name: Two agents and a person, with a kill in each half (stub model server, no network)
        run: pytest -q tests/test_orchestrate.py
      - name: A fixer that improvises cannot leave the approved plan (live_fix.py against a stub model server)
        run: pytest -q tests/test_live_fix.py
      - name: Triage-in-harness benchmark (every approved fix applied exactly once, and the incident resolved)
        run: |
          python -m triage_bridge.bench --seed 1
          python -c "import json,sys; r=json.load(open('triage_bridge/bench_results.json')); n=r['reached_gate']; ok=r['resume']['runs_with_duplicate'].startswith('0/') and r['resume']['runs_exactly_once']==f'{n}/{n}' and r['resume']['symptom_resolved']==f'{n}/{n}' and not r['resume']['still_broken']; sys.exit(0 if ok else 1)"
      - name: Real process kill and recovery
        run: python -m triage_bridge.demo
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,triage]"
      # The counterexamples, and the assertion that they still reject guessing, live in this file.
      - run: pytest -q tests/test_evolve.py
      - name: Show what the gate rejects
        run: python -m evolve --probes
      - name: Search must not be able to buy autonomy with a duplicated or dropped action
        run: |
          python -m evolve --generations 4 --seed 1
          python -c "import json,sys; l=json.load(open('evolve/results/history.json')); b=l['best']; sys.exit(0 if b['duplicates']==0 and b['dropped']==0 and b['ok'] else 1)"
      - uses: actions/upload-artifact@v4
        with: {name: evolve-ledger, path: evolve/results/}
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-harness-runtime .
