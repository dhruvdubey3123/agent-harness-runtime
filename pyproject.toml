[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-runtime"
version = "0.1.0"
description = "A small agent harness: owns the loop, sandboxes tools, logs every step, resumes after crashes, and distills skills from past runs."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dhruv Dubey"}]
dependencies = ["pydantic>=2.6", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
llm = ["anthropic>=0.40", "httpx>=0.27"]
local = ["httpx>=0.27"]
triage = ["pipeline-triage-graph @ git+https://github.com/dhruvdubey3123/pipeline-triage-graph.git", "langgraph-checkpoint-sqlite>=2"]
dev = ["pytest>=8", "httpx>=0.27", "mcp>=2.0"]

[tool.setuptools]
packages = ["harness", "bench", "triage_bridge", "evolve"]

[tool.setuptools.package-data]
triage_bridge = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
